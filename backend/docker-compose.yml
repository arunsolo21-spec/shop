services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshmart-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://freshmart:FreshMart@123@postgres:5432/freshmart?schema=public
      - JWT_SECRET=freshmart-super-secret-jwt-key-2026
      - JWT_EXPIRATION=7d
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
      - SMTP_FROM=FreshMart <noreply@freshmart.com>
      - RAZORPAY_KEY_ID=rzp_test_xxxxx
      - RAZORPAY_KEY_SECRET=xxxxx
      - RAZORPAY_WEBHOOK_SECRET=xxxxx
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,http://localhost:5174
      - FILE_UPLOAD_PATH=./public/uploads
      - MAX_FILE_SIZE=5242880
      - WEBHOOK_ALLOWED_IPS=127.0.0.1,::1,0.0.0.0
      - CLOUDINARY_CLOUD_NAME=your-cloud-name
      - CLOUDINARY_API_KEY=your-api-key
      - CLOUDINARY_API_SECRET=your-api-secret
      - FIREBASE_SERVICE_ACCOUNT={"type":"service_account","project_id":"your-project"}
      - GOOGLE_CLIENT_ID=your-google-client-id
      - ALLOWED_ORIGIN=http://localhost:5173,http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_volume:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - freshmart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: freshmart-postgres
    environment:
      POSTGRES_USER: freshmart
      POSTGRES_PASSWORD: FreshMart@123
      POSTGRES_DB: freshmart
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - freshmart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshmart -d freshmart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freshmart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - freshmart-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads_volume:

networks:
  freshmart-network:
    driver: bridge